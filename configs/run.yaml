# 极简实验配置（原子化架构 · 彻底重构版）
global_config:
  experiment_name: "genshin_weapon_test_100w"
  random_seed: 42
simulation:
  rounds: 5000
  draws_per_round: 200
data_generation:
  output_dir: "./experiments"
  chunk_size: 100000
data_analysis:
  target_rarity: "SSR"
  enabled: [
    "basic_stats", 
    "distribution", 
    "conditional_prob", 
    "two_dimensional",
    "consecutive_lose",
    "conditional_expectation",
    "confidence_interval",
    "guarantee_trigger_distribution",
    "weapon_fate_point"
  ]
  visualization:
    enabled: true
    dpi: 300
    figsize: [12, 8]
    style: "seaborn-v0_8"